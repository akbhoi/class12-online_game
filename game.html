<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangman Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .keyboard-btn {
        background-color: #4b5563; /* bg-gray-600 */
        color: #ffffff; /* text-white */
        font-weight: 700; /* font-bold */
        padding: 0.75rem 1rem; /* py-3 px-4 */
        border-radius: 0.5rem; /* rounded-lg */
        text-align: center; /* text-center */
        transition-property: background-color;
        transition-duration: 200ms;
        transition-timing-function: ease-in-out;
      }
      .keyboard-btn:hover {
        background-color: #6b7280; /* hover:bg-gray-500 */
      }
      .keyboard-btn:disabled {
        background-color: #1f2937; /* bg-gray-800 */
        color: #6b7280; /* text-gray-500 */
        cursor: not-allowed;
      }

      /* --- Rocket-to-the-Moon progress illustration --- */
      #rocket-group {
        transition: transform 400ms ease-in-out;
      }
      #rocket-flame {
        transform-origin: center;
        transition: opacity 200ms ease-in-out;
        opacity: 0;
      }
      #rocket-flame.firing {
        opacity: 1;
        animation: flame-flicker 300ms ease-in-out infinite alternate;
      }
      .fuel-cell {
        transition: opacity 300ms ease-in-out, fill 300ms ease-in-out;
      }
      .fuel-cell.spent {
        opacity: 0.25;
      }
      @keyframes flame-flicker {
        from {
          transform: scaleY(1);
        }
        to {
          transform: scaleY(1.25);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #rocket-group {
          transition: none;
        }
        #rocket-flame {
          animation: none;
        }
        .fuel-cell {
          transition: none;
        }
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4"
  >
    <div
      class="w-full max-w-3xl mx-auto flex flex-col lg:flex-row gap-8 items-center justify-center relative"
    >
      <!-- Loading overlay -->
      <div
        id="loading-game"
        class="absolute inset-0 bg-gray-900/90 flex items-center justify-center rounded-xl z-10"
      >
        <p class="text-gray-400 text-xl">Loading your game...</p>
      </div>

      <!-- Rocket-to-the-Moon Illustration -->
      <div class="w-full max-w-xs lg:w-1/3">
        <svg viewBox="0 0 200 260" class="w-full" aria-hidden="true">
          <!-- Night sky -->
          <rect x="0" y="0" width="200" height="260" rx="12" fill="#0f172a" />
          <circle cx="30" cy="30" r="1.5" fill="#e2e8f0" />
          <circle cx="60" cy="55" r="1" fill="#e2e8f0" />
          <circle cx="170" cy="40" r="1.5" fill="#e2e8f0" />
          <circle cx="145" cy="75" r="1" fill="#e2e8f0" />
          <circle cx="25" cy="100" r="1" fill="#e2e8f0" />
          <circle cx="180" cy="110" r="1" fill="#e2e8f0" />
          <circle cx="95" cy="35" r="1" fill="#e2e8f0" />

          <!-- Moon (the goal) -->
          <circle cx="100" cy="35" r="22" fill="#fde68a" />
          <circle cx="92" cy="27" r="4" fill="#fbbf24" opacity="0.6" />
          <circle cx="108" cy="42" r="3" fill="#fbbf24" opacity="0.6" />
          <circle cx="98" cy="45" r="2" fill="#fbbf24" opacity="0.6" />

          <!-- Fuel gauge: 7 cells, one dims per wrong guess -->
          <g id="fuel-gauge">
            <!-- cells stacked bottom-up; JS toggles the "spent" class -->
          </g>

          <!-- Launch pad -->
          <rect x="70" y="230" width="60" height="10" rx="2" fill="#334155" />

          <!-- Rocket (its vertical position is animated via transform) -->
          <g id="rocket-group" transform="translate(0, 0)">
            <g transform="translate(100, 210)">
              <!-- flame -->
              <path
                id="rocket-flame"
                d="M -6 22 Q 0 40 6 22 Q 0 30 -6 22 Z"
                fill="#f97316"
              />
              <!-- fins -->
              <path d="M -10 10 L -18 24 L -10 20 Z" fill="#38bdf8" />
              <path d="M 10 10 L 18 24 L 10 20 Z" fill="#38bdf8" />
              <!-- body -->
              <rect
                x="-10"
                y="-18"
                width="20"
                height="40"
                rx="10"
                fill="#e2e8f0"
              />
              <!-- nose cone -->
              <path d="M -10 -18 Q 0 -34 10 -18 Z" fill="#f87171" />
              <!-- window -->
              <circle cx="0" cy="-4" r="5" fill="#38bdf8" />
            </g>
          </g>
        </svg>
        <p
          id="rocket-caption"
          class="text-center text-sm text-gray-400 mt-2 h-5"
        ></p>
      </div>

      <!-- Game Info -->
      <div class="w-full lg:w-2/3 text-center lg:text-left">
        <p class="text-lg text-gray-400">
          Category:
          <span id="category-name" class="font-semibold text-cyan-400"
            >Loading...</span
          >
        </p>
        <h1
          id="word-display"
          class="text-4xl md:text-5xl font-bold my-6 tracking-widest"
        ></h1>
        <p class="text-md text-gray-400 mb-4">
          Misses:
          <span id="misses-display" class="text-red-400 font-semibold"></span>
        </p>
        <div id="keyboard" class="flex flex-col gap-2 mt-8 items-center lg:items-start"></div>
      </div>
    </div>

    <!-- Modal for Game Over -->
    <div
      id="modal"
      class="fixed inset-0 bg-black/75 flex items-center justify-center hidden"
    >
      <div class="bg-gray-800 p-8 rounded-xl shadow-2xl text-center">
        <h2 id="modal-title" class="text-3xl font-bold mb-4"></h2>
        <p id="modal-text" class="mb-6"></p>
        <button
          id="play-again-btn"
          class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-2 px-6 rounded-lg transition duration-300"
        >
          Play Again
        </button>
        <a
          href="index.html"
          class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded-lg transition duration-300 ml-4"
          >Change Category</a
        >
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // --- DOM Elements ---
        const categoryNameEl = document.getElementById("category-name");
        const wordDisplayEl = document.getElementById("word-display");
        const missesDisplayEl = document.getElementById("misses-display");
        const keyboardEl = document.getElementById("keyboard");
        const loadingGameEl = document.getElementById("loading-game");
        const modalEl = document.getElementById("modal");
        const modalTitleEl = document.getElementById("modal-title");
        const modalTextEl = document.getElementById("modal-text");
        const playAgainBtn = document.getElementById("play-again-btn");
        const rocketGroupEl = document.getElementById("rocket-group");
        const rocketFlameEl = document.getElementById("rocket-flame");
        const rocketCaptionEl = document.getElementById("rocket-caption");
        const fuelGaugeEl = document.getElementById("fuel-gauge");

        // --- Game State ---
        let wordToGuess = "";
        let guessedLetters = [];
        let incorrectGuesses = [];
        let wordQueue = []; // words fetched from the API but not yet played this session
        let currentCategoryId = null;
        const maxMistakes = 7; // matches the case study's "seven chances"
        const WORDS_PER_FETCH = 15;

        // --- Fuel gauge setup (7 cells, drawn once) ---
        const FUEL_CELL_COUNT = maxMistakes;
        const buildFuelGauge = () => {
          fuelGaugeEl.innerHTML = "";
          const cellWidth = 10;
          const cellHeight = 14;
          const gap = 4;
          const startY = 205 - FUEL_CELL_COUNT * (cellHeight + gap);
          for (let i = 0; i < FUEL_CELL_COUNT; i++) {
            const rect = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "rect"
            );
            rect.setAttribute("x", "20");
            rect.setAttribute("y", startY + i * (cellHeight + gap));
            rect.setAttribute("width", cellWidth);
            rect.setAttribute("height", cellHeight);
            rect.setAttribute("rx", "2");
            rect.setAttribute("fill", "#34d399");
            rect.classList.add("fuel-cell");
            rect.dataset.index = String(i);
            fuelGaugeEl.appendChild(rect);
          }
        };

        // --- Functions ---

        // Get category info from URL
        const getCategoryFromURL = () => {
          const params = new URLSearchParams(window.location.search);
          const categoryId = params.get("category_id");
          const categoryName = params.get("category_name");
          if (!categoryId || !categoryName) {
            window.location.href = "index.html"; // Redirect if no category
          }
          return { categoryId, categoryName };
        };

        // Fetch a batch of words for the category and refill the in-memory queue
        const fetchWords = async (categoryId) => {
          let response;
          try {
            response = await fetch(
              `/api/words/${categoryId}?count=${WORDS_PER_FETCH}`
            );
            if (!response.ok) {
              throw new Error(
                `Network response was not ok: ${response.statusText}`
              );
            }
            const data = await response.json();
            return (data.words || []).map((w) => w.toUpperCase());
          } catch (error) {
            console.error("Error fetching or parsing words:", error);
            if (response) {
              const errorText = await response.text();
              console.error("API Response Text:", errorText);
              wordDisplayEl.textContent = "API Error. Check console.";
            } else {
              wordDisplayEl.textContent = "Network Error. Check console.";
            }
            return [];
          }
        };

        // Get the next word to play, refilling the queue from the API if empty
        const nextWord = async (categoryId) => {
          if (wordQueue.length === 0) {
            wordQueue = await fetchWords(categoryId);
          }
          return wordQueue.shift() || null;
        };

        // Render the keyboard in the standard QWERTY layout, so students
        // build real typing-keyboard muscle memory while they play.
        const QWERTY_ROWS = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
        const renderKeyboard = () => {
          keyboardEl.innerHTML = "";
          QWERTY_ROWS.forEach((row, rowIndex) => {
            const rowEl = document.createElement("div");
            rowEl.className = `flex gap-2 ${
              rowIndex === 1 ? "ml-4 md:ml-6" : rowIndex === 2 ? "ml-8 md:ml-12" : ""
            }`;
            row.split("").forEach((letter) => {
              const button = document.createElement("button");
              button.textContent = letter;
              button.className = "keyboard-btn w-9 md:w-11";
              button.dataset.letter = letter;
              button.addEventListener("click", () => handleGuess(letter));
              rowEl.appendChild(button);
            });
            keyboardEl.appendChild(rowEl);
          });
        };

        // Render the word display (_ _ A _)
        const renderWordDisplay = () => {
          const display = wordToGuess
            .split("")
            .map((letter) => {
              if (letter === " ") return " ";
              return guessedLetters.includes(letter) ? letter : "_";
            })
            .join(" ");
          wordDisplayEl.textContent = display;
          return display;
        };

        // Update the rocket illustration to reflect current progress
        const updateRocket = (revealedFraction, missCount) => {
          // Rocket climbs from the pad (0) toward the Moon (1) as letters are revealed.
          const maxLift = 175; // px of vertical travel from pad to Moon
          const lift = Math.min(revealedFraction, 1) * maxLift;
          rocketGroupEl.setAttribute(
            "transform",
            `translate(0, -${lift.toFixed(1)})`
          );
          rocketFlameEl.classList.toggle(
            "firing",
            revealedFraction > 0 && revealedFraction < 1
          );

          // Dim one fuel cell per wrong guess, counting from the top of the stack.
          const cells = fuelGaugeEl.querySelectorAll(".fuel-cell");
          cells.forEach((cell) => {
            const index = Number(cell.dataset.index);
            const dim = index >= FUEL_CELL_COUNT - missCount;
            cell.classList.toggle("spent", dim);
          });

          if (missCount >= maxMistakes) {
            rocketCaptionEl.textContent = "Out of fuel";
          } else if (revealedFraction >= 1) {
            rocketCaptionEl.textContent = "Docked at the Moon!";
          } else {
            rocketCaptionEl.textContent = "";
          }
        };

        // Fraction of distinct letters in the word that have been guessed
        const revealedFraction = () => {
          const letters = new Set(
            wordToGuess.split("").filter((l) => l !== " ")
          );
          if (letters.size === 0) return 0;
          let revealed = 0;
          letters.forEach((l) => {
            if (guessedLetters.includes(l)) revealed++;
          });
          return revealed / letters.size;
        };

        // Handle a letter guess
        const handleGuess = (letter) => {
          if (!modalEl.classList.contains("hidden")) return;
          if (guessedLetters.includes(letter) || !wordToGuess) return;

          guessedLetters.push(letter);

          // Disable the guessed letter button
          const btn = keyboardEl.querySelector(`[data-letter="${letter}"]`);
          if (btn) btn.disabled = true;

          if (wordToGuess.includes(letter)) {
            // Correct guess
            renderWordDisplay();
          } else {
            // Incorrect guess
            incorrectGuesses.push(letter);
            missesDisplayEl.textContent = incorrectGuesses.join(", ");
          }

          updateRocket(revealedFraction(), incorrectGuesses.length);
          checkGameOver();
        };

        // Check for win/loss conditions
        const checkGameOver = () => {
          // Check for win
          const isWinner = wordToGuess
            .split("")
            .every(
              (letter) => letter === " " || guessedLetters.includes(letter)
            );
          if (isWinner) {
            showModal(true);
            return;
          }

          // Check for loss
          if (incorrectGuesses.length >= maxMistakes) {
            showModal(false);
          }
        };

        // Show game over modal
        const showModal = (didWin) => {
          if (didWin) {
            modalTitleEl.textContent = "Congratulations!";
            modalTitleEl.className = "text-3xl font-bold mb-4 text-cyan-400";
            modalTextEl.textContent = `You guessed the word: ${wordToGuess}`;
          } else {
            modalTitleEl.textContent = "Game Over";
            modalTitleEl.className = "text-3xl font-bold mb-4 text-red-400";
            modalTextEl.textContent = `The correct word was: ${wordToGuess}`;
          }
          modalEl.classList.remove("hidden");
        };

        // Initialize a new game
        const initGame = async () => {
          loadingGameEl.classList.remove("hidden");
          modalEl.classList.add("hidden");
          wordDisplayEl.textContent = "";
          rocketCaptionEl.textContent = "";

          const { categoryId, categoryName } = getCategoryFromURL();
          currentCategoryId = categoryId;
          categoryNameEl.textContent = decodeURIComponent(categoryName);

          wordToGuess = await nextWord(categoryId);
          // If nextWord returns null (due to an error), stop the game initialization
          if (!wordToGuess) {
            loadingGameEl.classList.add("hidden");
            return;
          }

          guessedLetters = [];
          incorrectGuesses = [];

          renderKeyboard();
          renderWordDisplay();
          missesDisplayEl.textContent = "";
          buildFuelGauge();
          updateRocket(0, 0);

          loadingGameEl.classList.add("hidden");
        };

        // --- Event Listeners ---
        playAgainBtn.addEventListener("click", initGame);

        document.addEventListener("keydown", (event) => {
          const letter = event.key.toUpperCase();
          if (letter.length === 1 && letter >= "A" && letter <= "Z") {
            handleGuess(letter);
          }
        });

        // --- Start Game ---
        initGame();
      });
    </script>
  </body>
</html>
